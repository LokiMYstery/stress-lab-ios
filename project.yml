name: StressLab
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: BYRP6L2B45
targets:
  StressLab:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.qiyin.stresslab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Stress Lab
        INFOPLIST_KEY_NSHealthShareUsageDescription: 读取心跳、心率、睡眠及活动数据，仅在本机计算和验证实验性身体压力指标。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: NO
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        CODE_SIGN_ENTITLEMENTS: StressLab.entitlements
    scheme:
      testTargets:
        - StressLabUITests
  StressLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UI
    dependencies:
      - target: StressLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.qiyin.stresslab.uitests
        GENERATE_INFOPLIST_FILE: YES
